name: rodeoflow
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - h5py
  - pytables>=3.9.2
  - ffmpeg
  - scipy
  - pandas
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  # Packages previously under pip:
  - transformers<4.44
  - pyocclient
  - fiftyone
  - hydra-core
  - omegaconf
  - imgaug
  - python-kaleido    # Note the name change for conda
  - kornia
  - lightning
  - matplotlib
  - moviepy=1.0.3     # Use single '=' for conda version pinning
  # Keep pip installed so your bash script can still run 'pip install git+...'
  - pip